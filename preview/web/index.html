<!doctype html><meta charset="utf-8"><title>四路临时低分辨率预览 v1.10</title>
<style>
body{font:16px system-ui;background:#101418;color:#e6edf3;margin:20px}.grid{display:grid;grid-auto-flow:column;grid-template-rows:1fr;grid-template-columns:repeat(4,minmax(300px,1fr));gap:12px;overflow-x:auto;align-items:start;padding-bottom:4px}.card{min-width:0;background:#1b242e;padding:10px;border-radius:8px;border-left:5px solid #4ea1ff}.card[data-tone=yellow]{border-left-color:#e4bd3d}.card[data-tone=red]{border-left-color:#ef6461}.card[draggable=true]{cursor:grab;outline:2px dashed #4ea1ff}.card.dragover{outline:3px solid #75d6ff}img{display:block;width:100%;background:#000;margin-top:6px}.muted{color:#b7c2cb}.guide,.scheduler,.placement{padding:12px;border-radius:8px;border-left:6px solid #4ea1ff;background:#182633;line-height:1.45;margin:12px 0}.guide[data-tone=yellow]{border-left-color:#e4bd3d;background:#302a17}.guide[data-tone=red]{border-left-color:#ef6461;background:#351c20}.badge{font-size:.78em;margin-left:8px;padding:2px 6px;border-radius:9px;background:#20364c;color:#bfe0ff}button{padding:8px;margin-top:8px;margin-right:8px}.legend{display:flex;gap:14px;flex-wrap:wrap;margin:12px 0}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;background:#4ea1ff}.yellow-dot{background:#e4bd3d}.red-dot{background:#ef6461}.placement h2{font-size:1em;margin:0 0 8px}.placement-grid{display:grid;grid-template-columns:repeat(4,minmax(110px,1fr));gap:8px;overflow-x:auto}.place{min-height:52px;border:1px solid #506273;border-radius:7px;padding:6px;background:#121b23}.place[data-active=true]{border:3px solid #e4bd3d;background:#302a17}.place[data-neighbor=true],.place[data-complete=true]{border:2px solid #4ea1ff;background:#182633}.board{font-size:1.4em}.steps{margin-top:8px;color:#c5d2dc}.arrow{font-size:1.2em;color:#bfe0ff;margin:0 5px}.inspection,.coverage{margin-top:8px;padding:7px;background:#121b23;border-radius:6px;font-size:.82em}.inspection-grid{display:grid;gap:1px;max-width:210px;margin-top:5px}.inspection-cell{aspect-ratio:1;background:#493d1d;border-radius:1px}.inspection-cell[data-hit=true]{background:#46bd73}.inspection-note,.coverage-note{margin-top:5px}.inspection a{color:#8fc5ff}.coverage-grid{display:grid;grid-template-columns:repeat(3,28px);gap:3px;margin-top:5px}.coverage-cell{height:28px;background:#333d47;border-radius:3px}.coverage-cell[data-hit=true]{background:#2775b7}
</style>
<h1>四路临时低分辨率预览 <span class="badge">v1.10</span></h1>
<p class="muted">仅作采集辅助。四路 Kalibr 原生探针各自只取最新低清帧；同一帧不重复检测。剩余临时中继时间：<b id="timer">—</b>；归零时自动保存并结束。</p>
<div class="legend"><span><i class="dot"></i>蓝：当前动作／已观察证据</span><span><i class="dot yellow-dot"></i>黄：证据不足或不确定</span><span><i class="dot red-dot"></i>红：预览流异常，建议暂停检查</span></div>
<div class="guide" id="guide" data-tone="blue">等待首批观测…</div>
<div class="scheduler" id="scheduler">四路独立原生探针：等待启动…</div>
<section class="placement"><h2>标定板摆放示意</h2><div id="placement">等待状态…</div></section>
<p class="muted">默认顺序：① BRIGHT　② RIGHT　③ LEFT　④ BLEFT（单行）。点击“编辑排布”可拖拽调整左右相邻关系；布局只保存在 Linux 浏览器本地。</p>
<button id="edit">编辑排布</button><button id="reset">恢复默认排布</button><div class="grid" id="grid"></div><button onclick="finish()">结束并保存报告</button>
<script>
const cams=['BRIGHT','RIGHT','LEFT','BLEFT'],key='headband-preview-layout-v1.10.3-row',API=`${location.protocol}//${location.hostname}:8767`;
const grid=document.querySelector('#grid');let editing=false,dragging=null,lastGuide={};
function layout(){try{let x=JSON.parse(localStorage.getItem(key));return Array.isArray(x)&&x.length===4&&new Set(x).size===4?x:cams}catch(e){return cams}}
function save(){localStorage.setItem(key,JSON.stringify([...grid.children].map(x=>x.dataset.camera)))}
function card(c){return `<div class="card" data-tone="blue" data-camera="${c}"><b id="title-${c}">${c}</b><span class="badge" id="badge-${c}">等待中</span><br><small class="muted" id="status-${c}">等待中</small><img src="/stream/${c}"><div class="inspection" id="inspection-${c}">等待最近 Kalibr 原生采样帧…</div><div class="coverage" id="coverage-${c}">完整网格覆盖：等待完整候选…</div></div>`}
layout().forEach(c=>grid.insertAdjacentHTML('beforeend',card(c)));
function setEditing(v){editing=v;document.querySelector('#edit').textContent=v?'完成排布':'编辑排布';[...grid.children].forEach(x=>x.draggable=v)}
grid.addEventListener('dragstart',e=>{if(editing)dragging=e.target.closest('.card')});grid.addEventListener('dragover',e=>{if(editing){e.preventDefault();e.target.closest('.card')?.classList.add('dragover')}});grid.addEventListener('dragleave',e=>e.target.closest('.card')?.classList.remove('dragover'));grid.addEventListener('drop',e=>{e.preventDefault();let t=e.target.closest('.card');if(editing&&dragging&&t&&t!==dragging){grid.insertBefore(dragging,t);save()}[...grid.children].forEach(x=>x.classList.remove('dragover'));drawPlacement(lastGuide)});
document.querySelector('#edit').onclick=()=>setEditing(!editing);document.querySelector('#reset').onclick=()=>{localStorage.removeItem(key);cams.forEach(c=>grid.appendChild([...grid.children].find(x=>x.dataset.camera===c)));save();drawPlacement(lastGuide)};
function ordered(){return [...grid.children].map(x=>x.dataset.camera)}function neighbors(name){const x=ordered(),i=x.indexOf(name);return [x[i-1],x[i+1]].filter(Boolean)}function arrow(a,b){return ordered().indexOf(b)>ordered().indexOf(a)?'→':'←'}
function tone(c){return ['STREAM_STALE','STREAM_MISSING'].includes(c.stream_state)?'red':(c.native_preview_observation.complete||c.native_preview_history.complete_grid_observations>0?'blue':'yellow')}
function drawInspection(camera,e,meta){const box=document.querySelector('#inspection-'+camera),rows=Number(e.grid_rows||0),cols=Number(e.grid_cols||0),cells=new Set((e.observed_cells||[]).map(x=>x[0]+':'+x[1]));if(!rows||!cols||rows*cols>400){box.textContent='最近 Kalibr 原生采样帧：未观察到可绘制角点网格。';return}let map='';for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)map+=`<i class="inspection-cell" data-hit="${cells.has(r+':'+c)}"></i>`;const link=meta.available?`<a href="/inspection/${camera}?t=${encodeURIComponent(meta.captured_utc||'')}" target="_blank" rel="noopener">查看带绿色角点的最近原生采样图</a>`:'采样图尚未生成';box.innerHTML=`<b>原生角点网格（采样帧）</b>：绿=已观察，黄=未观察；不是 Tag 数，也不等同当前视频帧。<div class="inspection-grid" style="grid-template-columns:repeat(${cols},1fr)">${map}</div><div class="inspection-note">${link}</div>`}
function drawCoverage(camera,c){const box=document.querySelector('#coverage-'+camera),cells=new Set((c.observed_cells||[]).map(x=>x[0]+':'+x[1]));let map='';for(let r=0;r<3;r++)for(let col=0;col<3;col++)map+=`<i class="coverage-cell" data-hit="${cells.has(r+':'+col)}"></i>`;const has=c.bbox_area_ratio_min!==null&&c.bbox_area_ratio_max!==null,area=has?`${Math.round(Number(c.bbox_area_ratio_min)*1000)/10}%–${Math.round(Number(c.bbox_area_ratio_max)*1000)/10}%`:'尚无完整候选';box.innerHTML=`<b>完整候选位置记录</b>：蓝=该区域曾有 <code>144/144</code>；灰=可选补充位置，不是待填任务。<div class="coverage-grid">${map}</div><div class="coverage-note">完整候选板框占画面：${area}。不要求填满九格，不设数量门槛或通过结论。</div>`}
function guide(raw){const s=raw.cameras,broken=cams.filter(c=>['STREAM_STALE','STREAM_MISSING'].includes(s[c].stream_state));if(broken.length)return {tone:'red',text:`暂停采集检查：${broken.join('、')} 预览流未正常更新。红色仅表示预览传输异常，不判断标定结果。`};const waiting=cams.filter(c=>s[c].stream_state==='WAITING_FOR_STREAM');if(waiting.length)return {tone:'yellow',text:`等待预览流：${waiting.join('、')} 尚在启动。未收到画面时不判断标定结果。`};const lacking=[...cams].sort((a,b)=>{let A=s[a].native_preview_history,B=s[b].native_preview_history;return (A.complete_grid_observations?1:0)-(B.complete_grid_observations?1:0)||A.best_corners-B.best_corners}),target=lacking[0],h=s[target].native_preview_history,n=neighbors(target).sort((a,b)=>s[b].native_preview_history.best_corners-s[a].native_preview_history.best_corners)[0];if(!h.complete_grid_observations)return {tone:'yellow',target,neighbor:n,text:`优先补 ${target}：历史最佳 ${h.best_corners}/144，尚未观察到完整网格。让整块板四边进入、居中并短暂停留；随后保持与相邻 ${n} 的重叠。低清未观察到只表示不确定。`};if(!raw.near_time_four_view.observed)return {tone:'blue',target,neighbor:n,text:`${target} 已有完整网格候选。下一步从 ${target} 缓慢移向相邻 ${n}，保留标定板重叠；近期四路共同可见尚未观察到，不作为通过门槛。`};return {tone:'blue',done:true,text:'近期四路均观察到标定板。可补不同距离、倾角和画面位置的完整板；该提示不设合格次数，最终仍以原 Kalibr 与重投影验证为准。'}}
function drawPlacement(g){const box=document.querySelector('#placement');if(g.done){box.innerHTML=`<div class="placement-grid">${ordered().map(c=>`<div class="place" data-complete="true"><b>${c}</b><br><span class="board">▦</span> 已有近时共同证据</div>`).join('')}</div><div class="steps">下一步不是结束判定：可补不同距离、倾角和画面边缘位置。</div>`;return}if(!g.target){box.innerHTML='<span class="muted">等待可用的四路状态后显示当前摆放动作；不会据此判定 Kalibr 成败。</span>';return}const a=arrow(g.target,g.neighbor);box.innerHTML=`<div class="placement-grid">${ordered().map(c=>`<div class="place" data-active="${c===g.target}" data-neighbor="${c===g.neighbor}"><b>${c}</b>${c===g.target?'<br><span class="board">▦</span> 整板进入并居中':''}${c===g.neighbor?'<br><span class="arrow">'+a+'</span> 保留重叠':''}</div>`).join('')}</div><div class="steps">① 将完整标定板放入 <b>${g.target}</b> 并短暂停留　② 沿 <b>${a}</b> 方向缓慢过渡至 <b>${g.neighbor}</b>，保持两路重叠　③ 再补距离、倾角与边缘位置。</div>`}
let updating=false;async function update(){if(updating)return;updating=true;try{const r=await fetch(API+'/api/state',{cache:'no-store'});if(!r.ok)throw Error(`状态接口 HTTP ${r.status}`);const raw=await r.json(),s=raw.cameras,g=guide(raw),panel=document.querySelector('#guide'),sch=raw.probe_scheduler||{},session=raw.session||{};lastGuide=g;panel.dataset.tone=g.tone;panel.textContent=g.text;document.querySelector('#timer').textContent=Number(session.configured_seconds||0)>0?`${Math.max(0,Math.ceil(Number(session.remaining_seconds||0)))} 秒`:'手动结束';document.querySelector('#scheduler').textContent=`原生探针：四路自动独立运行，只取最新帧；目标每路约 ${sch.target_period_seconds||1} 秒一次，单路超时 ${sch.timeout_seconds||5} 秒。页面显示的是实际完成数、耗时、超时与异常。`;drawPlacement(g);cams.forEach(c=>{const x=s[c],e=x.native_preview_observation,h=x.native_preview_history,p=x.native_probe_runtime,t=tone(x),el=document.querySelector(`[data-camera="${c}"]`),age=x.frame_age_seconds===null?'—':`${x.frame_age_seconds}s`,dur=p.last_duration_seconds===null?'—':`${p.last_duration_seconds}s`;el.dataset.tone=t;document.querySelector('#title-'+c).textContent=`${c} · ${x.preview_fps_window} FPS`;document.querySelector('#badge-'+c).textContent=t==='red'?'预览异常':t==='yellow'?'证据不足':'已观察证据';document.querySelector('#status-'+c).textContent=`流 ${x.stream_state==='STREAM_LIVE'?'正常':'未正常'} · 帧龄 ${age} · 最近 ${e.found_corners}/${e.expected_corners} · 历史最佳 ${h.best_corners}/144 · 完整网格 ${h.complete_grid_observations} 次 · 检测完成 ${p.completed} · 超时 ${p.timeouts} · 异常 ${p.errors} · 最近耗时 ${dur}`;drawInspection(c,e,x.native_inspection||{});drawCoverage(c,x.native_complete_coverage||{})})}catch(e){const p=document.querySelector('#guide');p.dataset.tone='yellow';p.textContent=`状态提示暂不可用（${e.message}）；视频画面不受影响，不据此判断头环异常。`;drawPlacement({})}finally{updating=false}}
async function finish(){const r=await fetch(API+'/api/finish');const x=await r.json();alert('报告：'+x.report)}update();setInterval(update,1000);
</script>
